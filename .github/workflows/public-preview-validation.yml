name: CryptoGPT public preview validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_PACKAGE: one-intent-hyperliquid-wallet-complete-reviewed-2026-07-29.3
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Create validation environment
        run: python3 -m venv "$RUNNER_TEMP/cryptogpt-venv"
      - name: Install exact validation dependencies
        run: |
          "$RUNNER_TEMP/cryptogpt-venv/bin/python" -m pip install \
            --requirement "$CANONICAL_PACKAGE/tools/requirements.txt" \
            --requirement "$CANONICAL_PACKAGE/tools/requirements-visual.txt"
          "$RUNNER_TEMP/cryptogpt-venv/bin/python" -m playwright install --with-deps chromium firefox webkit
      - name: Validate sanitized package
        run: |
          "$RUNNER_TEMP/cryptogpt-venv/bin/python" "$CANONICAL_PACKAGE/tools/run_full_validation.py"
      - name: Verify Android dependency locks and artifacts
        working-directory: ${{ env.CANONICAL_PACKAGE }}/apps/android
        run: ./gradlew --no-daemon test assembleRelease bundleRelease
